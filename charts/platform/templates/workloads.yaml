{{- range $name, $service := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  {{- if $service.googleAccess }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "serviceAccounts" (index $.Values.serviceAccounts $name) }}
  {{- end }}
{{- if not $service.googleAccess }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $.Values.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        # envFrom does not restart Pods when a ConfigMap changes, this does.
        checksum/env: {{ tpl ($.Files.Get (printf "env/%s.yaml" $name)) $ | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ $.Values.imagePrefix }}/{{ $name }}:{{ required "imageTag" $.Values.imageTag }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ $name }}-env
          # Startup reads secrets and opens the database, which takes a while on a new node.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            {{- if $service.database }}
            - name: db-ca
              mountPath: /etc/db-ca
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if $service.database }}
        - name: db-ca
          configMap:
            name: db-ca
        {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-ca
data:
  ca.pem: {{ .Values.database.caCert | quote }}
