apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
spec:
  gatewayClassName: gke-l7-regional-external-managed
  addresses:
    - type: NamedAddress
      value: {{ .Values.ingress.addressName }}
  # HTTPS only: there is deliberately no listener on port 80.
  listeners:
    {{- range $name, $service := .Values.services }}
    {{- if $service.public }}
    {{- $ingress := required "ingress.services" (index $.Values.ingress.services $name) }}
    - name: {{ $name }}
      protocol: HTTPS
      port: 443
      hostname: {{ $ingress.hostname | quote }}
      tls:
        mode: Terminate
        options:
          networking.gke.io/cert-manager-certs: {{ $ingress.certificateName }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    {{- end }}
{{- range $name, $service := .Values.services }}
{{- if $service.public }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
spec:
  parentRefs:
    - name: public
      sectionName: {{ $name }}
  hostnames:
    - {{ (index $.Values.ingress.services $name).hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ $name }}
          port: 8080
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ $name }}
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: {{ $name }}
{{- end }}
{{- end }}
