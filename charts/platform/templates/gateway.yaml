apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
spec:
  gatewayClassName: gke-l7-regional-external-managed
  addresses:
    - type: NamedAddress
      value: {{ .Values.ingress.addressName }}
  # HTTPS only: there is deliberately no listener on port 80.
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.ingress.hostname | quote }}
      tls:
        mode: Terminate
        options:
          networking.gke.io/cert-manager-certs: {{ .Values.ingress.certificateName }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - name: public
  hostnames:
    - {{ .Values.ingress.hostname | quote }}
  rules:
    - backendRefs:
        - name: api
          port: 8080
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: api
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: api
