apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: 169.254.20.10/32
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-google-and-database
spec:
  # Every service with Google access. Without it, a service reaches neither of these.
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          {{- range $name, $service := .Values.services }}
          {{- if $service.googleAccess }}
          - {{ $name }}
          {{- end }}
          {{- end }}
  policyTypes: [Egress]
  egress:
    # GKE metadata server, needed for Workload Identity
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - { protocol: TCP, port: 80 }
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - { protocol: TCP, port: 988 }
    # Google APIs through Private Google Access. Without NAT nothing else answers on 443.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
      ports:
        - { protocol: TCP, port: 443 }
    # Database
    - to:
        - ipBlock:
            cidr: {{ .Values.database.host }}/32
      ports:
        - { protocol: TCP, port: 5432 }
---
# Kubelet probes need no rule: traffic from a Pod's own node is always allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-from-load-balancer
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          {{- range $name, $service := .Values.services }}
          {{- if $service.public }}
          - {{ $name }}
          {{- end }}
          {{- end }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.ingress.proxyOnlyCidr }}
        {{- range .Values.healthCheckCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-reporter
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: reporter
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-reporter-from-api
spec:
  podSelector:
    matchLabels:
      app: reporter
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-services
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [api, worker, dlq-handler, reporter]
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-from-web
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [api, worker, dlq-handler, reporter]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - { protocol: TCP, port: 8080 }
